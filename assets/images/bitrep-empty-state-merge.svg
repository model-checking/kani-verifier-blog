<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">Two empty accumulator states that merge to different bytes</title>
  <desc id="d">Two ExtremaF64 states are both empty, differing only in min_bits, a field the
  merge never reads. Merging in either order short-circuits and keeps the receiver's bits, so the
  two results serialise to different byte strings while meaning the same thing.</desc>

  <style>
    .lbl  { font-size: 13px; fill: #24292f; }
    .mono { font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #24292f; }
    .dim  { font-size: 11.5px; fill: #6e7781; font-style: italic; }
    .hd   { font-size: 13.5px; font-weight: 600; fill: #24292f; }
    .warn { fill: #b42318; }
    .box  { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; rx: 6; }
    .arw  { stroke: #57606a; stroke-width: 1.4; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <text x="380" y="24" class="hd" text-anchor="middle">Two states the decoder accepts</text>

  <!-- input states -->
  <rect class="box" x="40"  y="40" width="300" height="96"/>
  <rect class="box" x="420" y="40" width="300" height="96"/>
  <text x="56"  y="62" class="hd">A</text>
  <text x="436" y="62" class="hd">B</text>
  <text x="56"  y="86"  class="mono">seen     = false</text>
  <text x="436" y="86"  class="mono">seen     = false</text>
  <text x="56"  y="106" class="mono">min_bits = 0x…FFFF_FFF<tspan class="warn" font-weight="700">F</tspan></text>
  <text x="436" y="106" class="mono">min_bits = 0x…FFFF_FFF<tspan class="warn" font-weight="700">E</tspan></text>
  <text x="56"  y="126" class="dim">empty, so min_bits is never read</text>
  <text x="436" y="126" class="dim">empty, so min_bits is never read</text>

  <!-- merge step -->
  <text x="190" y="166" class="lbl" text-anchor="middle">A.merge(B)</text>
  <text x="570" y="166" class="lbl" text-anchor="middle">B.merge(A)</text>
  <path class="arw" d="M190,174 L190,214"/>
  <path class="arw" d="M570,174 L570,214"/>
  <rect x="196" y="180" width="368" height="26" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="380" y="197" class="mono" text-anchor="middle">if !other.seen { return }   ← both take this branch</text>

  <!-- results -->
  <rect class="box" x="40"  y="222" width="300" height="70"/>
  <rect class="box" x="420" y="222" width="300" height="70"/>
  <text x="56"  y="246" class="lbl">keeps <tspan font-weight="600">A</tspan>'s bits</text>
  <text x="436" y="246" class="lbl">keeps <tspan font-weight="600">B</tspan>'s bits</text>
  <text x="56"  y="270" class="mono">min_bits = 0x…FFFF_FFF<tspan class="warn" font-weight="700">F</tspan></text>
  <text x="436" y="270" class="mono">min_bits = 0x…FFFF_FFF<tspan class="warn" font-weight="700">E</tspan></text>

  <path class="arw" d="M190,296 L190,336"/>
  <path class="arw" d="M570,296 L570,336"/>
  <text x="190" y="320" class="dim" text-anchor="middle">to_bytes()</text>
  <text x="570" y="320" class="dim" text-anchor="middle">to_bytes()</text>

  <!-- bytes -->
  <rect class="box" x="70"  y="344" width="240" height="38"/>
  <rect class="box" x="450" y="344" width="240" height="38"/>
  <text x="190" y="369" class="mono" text-anchor="middle">… FF FF FF <tspan class="warn" font-weight="700">FF</tspan></text>
  <text x="570" y="369" class="mono" text-anchor="middle">… FF FF FF <tspan class="warn" font-weight="700">FE</tspan></text>
  <text x="380" y="370" class="hd warn" text-anchor="middle" font-size="20">≠</text>

  <text x="380" y="418" class="hd" text-anchor="middle">Same meaning. Different bytes.</text>
  <text x="380" y="440" class="lbl" text-anchor="middle">Merge commutativity, stated over the encoded state, is false.</text>
  <text x="380" y="470" class="dim" text-anchor="middle">No accumulator built by calling add() can reach these states. They exist only by decoding.</text>
</svg>
